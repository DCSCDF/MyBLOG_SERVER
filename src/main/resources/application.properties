spring.application.name=Myblog_dev
server.port=8088
spring.datasource.url=jdbc:mysql://localhost:3306/myblog_sql?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=1012414217
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.global-config.db-config.id-type=auto
# Sa-Token
#  sa-token: concurrent one login
sa-token.is-concurrent=false
sa-token.timeout=2592000
#sa-token.active-timeout=1800
sa-token.is-share=true
sa-token.token-name=token
sa-token.is-read-cookie=false
sa-token.is-read-header=true
#sa-token.is-read-body=false

#  sa-token: Log out
sa-token.is-log=true
#  sa-token: uuid,simple-uuid,random-32,random-64,random-128,tik
sa-token.token-style=random-128
#  schema.sql
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.platform=mysql
aj.captcha.cache-type=local
aj.captcha.type=blockPuzzle
aj.captcha.slip-offset=5
aj.captcha.aes-status=true
aj.captcha.interference-options=2
aj.captcha.font-style=1
aj.captcha.font-size=25
aj.captcha.req-frequency-limit-enable=false
# CORS  (dev,webUse)
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173


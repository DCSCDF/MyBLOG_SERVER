spring.application.name=Myblog_dev
server.port=8088
# 数据库凭据通过环境变量注入（默认值仅供本地开发，生产必须设置 DB_PASSWORD 等强密码）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/myblog_sql?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:jiuliu}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.global-config.db-config.id-type=auto
# Spring Security（令牌语义与迁移前保持不变）
#  单端登录：新登录挤掉旧令牌；令牌为 random-128 风格不透明随机串，仅从请求头读取
app.security.token-name=token
app.security.token-timeout=2592000
# 未勾选记住我时的活跃超时时间（秒），2小时无API访问则token失效
app.login.active-timeout-no-remember=7200
#  schema.sql
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.platform=mysql
spring.sql.init.schema-locations=classpath:schema.sql
captcha.prefix=captcha
captcha.expire.default=120000
captcha.expire.WORD_IMAGE_CLICK=120000
captcha.init-default-resource=true
captcha.local-cache-enabled=true
captcha.local-cache-size=50
captcha.local-cache-wait-time=5000
captcha.local-cache-period=2000
captcha.local-cache-ignored-cache-fields=
# 已移除 captcha.font-path：原配置指向不存在的 classpath:font/SimHei.ttf，导致文字点选验证码约 98% 概率 500；改用内置字体
captcha.secondary.enabled=true
captcha.secondary.expire=120000
captcha.secondary.keyPrefix=captcha:secondary



# CORS  (dev,webUse)  生产通过环境变量 CORS_ALLOWED_ORIGINS 注入前端域名
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,http://localhost:3001}

# 可信反向代理 IP 列表（逗号分隔）。应用直连公网时无需配置（默认忽略伪造的转发头）；
# 部署在 Nginx/网关之后时，填写代理机 IP 以正确解析客户端真实 IP（如 app.security.trusted-proxies=127.0.0.1,172.18.0.1）
app.security.trusted-proxies=

# comment
app.comment.max-nest-level=10

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB





#
# [application-test.properties]
# =======================================
# Test configuration for running unit and integration tests
# =======================================
#

# Test database configuration (use H2 in-memory database for testing)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.global-config.db-config.id-type=auto

# Sa-Token
sa-token.is-concurrent=false
sa-token.timeout=3600
sa-token.is-share=true
sa-token.token-name=token
sa-token.is-read-cookie=false
sa-token.is-read-header=true
sa-token.is-log=false
sa-token.token-style=random-128

# SQL init for tests - create schema
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.platform=h2

# Server port
server.port=0

# Logging
logging.level.root=WARN
logging.level.com.jiuliu.myblog_dev=DEBUG

# CORS for tests
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
